name: Security and SEO checks

on:
  pull_request:
    branches:
      - main
      - dev
      - fix/public-website-ssr-contact-accessibility
      - fix/staark-sec-002-auth-hardening

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://staark:build-only@localhost:5432/staark
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_SECRET: sec002-ci-auth-secret-0123456789abcdef
      MFA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      MFA_BROWSER_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: staark
          POSTGRES_PASSWORD: build-only
          POSTGRES_DB: staark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staark -d staark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Enforce Hub design contract
        run: node scripts/check-hub-theme-contract.mjs
      - run: npm ci
      - name: Apply migrations to disposable CI database
        run: npx prisma migrate deploy
      - run: npm run test:security-hardening
      - run: npm run test:mfa
      - run: npm run test:security-seo
      - run: npm run test:news
      - run: npm run test:public-website
      - run: npm run test:google-ads
      - name: Add CI-only error fixture
        run: |
          mkdir -p app/a11y-error-fixture
          cat > app/a11y-error-fixture/page.tsx <<'EOF'
          export const dynamic = "force-dynamic";
          export default function ErrorFixture() { throw new Error("CI error boundary fixture"); }
          EOF
      - name: Add CI-only Hub UI fixture
        run: node scripts/create-hub-ui-fixture.mjs
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Check production HTTP responses
        run: |
          npm run seed:mfa-browser
          npm start -- --hostname 127.0.0.1 > /tmp/next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run check:security-seo
          CHECK_ERROR_FIXTURE=1 npm run check:public-browser
          npm run check:google-ads-browser
          npm run check:hub-browser
          npm run check:mfa-browser
